# Cabeceras de seguridad comunes. Se incluye en el server y en cada location que define
# add_header (nginx no hereda add_header cuando un location declara el suyo).
#
# CSP compatible con la aplicación:
#  - script-src 'self': el build de producción no emite scripts en línea.
#  - style-src 'unsafe-inline': Leaflet inserta estilos en línea en marcadores y tooltips.
#  - img-src: teselas de OpenStreetMap, vistas previas locales de la foto (blob:) y data:.
#  - connect-src: el API (mismo origen) y OSRM para trazar rutas por carretera.
# HSTS lo aplica el proxy que termina TLS (Traefik en Dokploy), no este contenedor.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://router.project-osrm.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
